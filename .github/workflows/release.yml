name: CI and Release Java Starter (praxis-metadata-starter)
'on':
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      create_tag:
        description: Create and push git tag from main (recommended).
        required: false
        default: true
        type: boolean
      version:
        description: Explicit version (e.g. 1.0.0 or 1.0.0-rc.1). Optional when bump is provided.
        required: false
        type: string
      bump:
        description: Semver bump to compute the next version when version is empty.
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: Pre-release identifier when bump=prerelease (alpha, beta, rc).
        required: false
        default: rc
        type: string
concurrency:
  group: java-release-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  create_tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      resolved_version: ${{ steps.compute_version.outputs.resolved_version }}
      resolved_tag: ${{ steps.compute_version.outputs.resolved_tag }}
    steps:
      - name: Require intentional release preparation
        env:
          CREATE_TAG: ${{ inputs.create_tag }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/main && "$CREATE_TAG" == true && -n "$RELEASE_PAT" ]] || { echo '::error::Use main, create_tag=true and a configured RELEASE_PAT to trigger the tag publication.'; exit 1; }
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          ref: ${{ github.sha }}
      - name: Set up Java 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Require main
        shell: bash
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
      - name: Compute next version
        id: compute_version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force >/dev/null 2>&1 || true

          normalize_version() {
            local v="$1"
            v="${v#v}"
            echo "$v"
          }

          validate_version() {
            local v="$1"
            if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '$v'. Expected semver, e.g. 1.0.0 or 1.0.0-rc.1"
              exit 1
            fi
          }

          latest_stable() {
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^v//' \
              | sort -V \
              | tail -n1 || true
          }

          latest_any_semver() {
            git tag -l 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' \
              | sed 's/^v//' \
              | sort -V \
              | tail -n1 || true
          }

          bump_stable() {
            local base="$1"
            local bump="$2"
            local major minor patch
            IFS='.' read -r major minor patch <<< "$base"
            case "$bump" in
              major) echo "$((major + 1)).0.0" ;;
              minor) echo "$major.$((minor + 1)).0" ;;
              patch) echo "$major.$minor.$((patch + 1))" ;;
              *)
                echo "::error::Invalid bump '$bump'. Use: major | minor | patch | prerelease"
                exit 1
                ;;
            esac
          }

          next_prerelease() {
            local preid="$1"
            local stable="$2"
            local last_pre base n major minor patch

            if [[ ! "$preid" =~ ^[0-9A-Za-z-]+$ ]]; then
              echo "::error::Invalid preid '$preid'. Use only [0-9A-Za-z-]"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "$stable"
            base="${major}.${minor}.${patch}"

            last_pre="$(
              git tag -l "v${base}-${preid}.*" \
                | grep -E "^v${base//./\\.}-${preid}\.[0-9]+$" \
                | sed 's/^v//' \
                | sort -V \
                | tail -n1 || true
            )"

            if [[ -n "${last_pre:-}" ]]; then
              n="${last_pre##*.}"
              echo "${base}-${preid}.$((n + 1))"
              return
            fi

            echo "${base}-${preid}.1"
          }

          VERSION_INPUT="${RELEASE_INPUT_VERSION}"
          BUMP_INPUT="${RELEASE_INPUT_BUMP}"
          PREID_INPUT="${RELEASE_INPUT_PREID}"

          VERSION=""
          if [[ -n "${VERSION_INPUT:-}" ]]; then
            VERSION="$(normalize_version "$VERSION_INPUT")"
          else
            if [[ "$BUMP_INPUT" == "prerelease" ]]; then
              # Continue the highest semantic release line, even when the latest
              # published artifact is still an rc/beta. Otherwise an old stable
              # tag such as v0.1.0 can incorrectly anchor new prereleases.
              BASE="$(latest_any_semver)"
              if [[ -n "${BASE:-}" ]]; then
                BASE="${BASE%%-*}"
              fi
              if [[ -z "${BASE:-}" ]]; then
                BASE="1.0.0"
              fi
              VERSION="$(next_prerelease "${PREID_INPUT:-rc}" "$BASE")"
            else
              BASE="$(latest_stable)"
              if [[ -z "${BASE:-}" ]]; then
                BASE="0.0.0"
              fi
              VERSION="$(bump_stable "$BASE" "$BUMP_INPUT")"
            fi
          fi

          validate_version "$VERSION"
          TAG="v$VERSION"

          echo "resolved_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved_tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### Release Tag Prepared"
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
          RELEASE_INPUT_BUMP: ${{ inputs.bump }}
          RELEASE_INPUT_PREID: ${{ inputs.preid }}
      - name: Persist version and push main and tag atomically
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || { echo '::error::main advanced; prepare the current revision deliberately.'; exit 1; }
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then echo '::error::Release tag already exists.'; exit 1; fi
          mvn -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml
          if ! git diff --cached --quiet; then git commit -m "chore(release): $TAG"; fi
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
        env:
          VERSION: ${{ steps.compute_version.outputs.resolved_version }}
          TAG: ${{ steps.compute_version.outputs.resolved_tag }}
    timeout-minutes: 10
  release:
    name: Publish to Maven Central
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CENTRAL_TOKEN_USER: ${{ secrets.CENTRAL_TOKEN_USER }}
      CENTRAL_TOKEN_PASS: ${{ secrets.CENTRAL_TOKEN_PASS }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - name: Require a tag from main
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo '::error::Publication requires a version tag.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Tagged revision is not on main.'; exit 1; }
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Set up Java 21 (Temurin) + Central server
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USER
          server-password: CENTRAL_TOKEN_PASS
      - name: Public contract hygiene gate
        run: scripts/check-public-contract-gate.sh
      - name: Import GPG private key (sanitize + import)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          printf '%s' "$GPG_PRIVATE_KEY" > /tmp/gpg.key.raw
          perl -i -pe 's/^\x{FEFF}//;' /tmp/gpg.key.raw
          tr -d '\r' < /tmp/gpg.key.raw > /tmp/gpg.key.nocrlf
          if grep -q "BEGIN PGP PRIVATE KEY BLOCK" /tmp/gpg.key.nocrlf; then
            awk '/BEGIN PGP PRIVATE KEY BLOCK/{found=1; print "-----BEGIN PGP PRIVATE KEY BLOCK-----"; print ""; next} found && /END PGP PRIVATE KEY BLOCK/{print "-----END PGP PRIVATE KEY BLOCK-----"; exit} found{print}' /tmp/gpg.key.nocrlf > /tmp/gpg.key
          else
            tr -d ' \t\n\r' < /tmp/gpg.key.nocrlf > /tmp/gpg.key.b64
            base64 -d /tmp/gpg.key.b64 > /tmp/gpg.key
          fi
          gpg --batch --import /tmp/gpg.key
          gpg --batch --list-secret-keys --keyid-format LONG
      - name: Resolve GPG key id (fallback if secret missing)
        run: |
          set -euo pipefail
          if [ -z "${GPG_KEY_ID:-}" ]; then
            KEY=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
            if [ -z "$KEY" ]; then
              echo "No GPG secret key found after import" >&2
              exit 1
            fi
            echo "GPG_KEY_ID=$KEY" >> "$GITHUB_ENV"
            echo "Resolved GPG_KEY_ID=$KEY"
          else
            echo "GPG_KEY_ID provided via secrets"
          fi
      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version '$V'. Expected semver, e.g. 1.0.0 or 1.0.0-rc.1"
            exit 1
          fi
          echo "resolved=${V}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"
      - name: Verify persisted tagged version
        run: |
          [[ "$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)" == "$VERSION" ]] || { echo "::error::POM and tag differ."; exit 1; }
        env:
          VERSION: ${{ steps.ver.outputs.resolved }}
      - name: Build, test, sign and publish the tagged release
        run: |
          V='${{ steps.ver.outputs.resolved }}'
          echo "Publishing praxis-metadata-starter ${V} to Sonatype Central Portal."
          echo "The plugin waits until upload is accepted; the next step performs explicit Maven Central availability checks."
          ./mvnw -B -P release -Dgpg.skip=false -Dgpg.keyname="${GPG_KEY_ID}" -Dgpg.passphrase="${MAVEN_GPG_PASSPHRASE}" -DautoPublish=true -DwaitUntil=uploaded -DwaitMaxTime=1800 -T 1C \
            clean verify org.sonatype.central:central-publishing-maven-plugin:publish
          {
            echo "### Central Publish Submitted"
            echo "- Version: \`${V}\`"
            echo "- Plugin wait: \`uploaded\` for up to 1800 seconds"
            echo "- Next: Maven Central availability probe"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Maven Central availability
        shell: bash
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.resolved }}'
          GROUP_PATH="io/github/codexrodrigues"
          ARTIFACT="praxis-metadata-starter"
          POM_URL="https://repo1.maven.org/maven2/${GROUP_PATH}/${ARTIFACT}/${V}/${ARTIFACT}-${V}.pom"
          # Central propagation is usually fast, but recent releases took just over
          # 20 minutes after an accepted upload. Keep this as a release-only gate.
          ATTEMPTS=80
          DELAY_SECONDS=30
          MAX_WAIT_MINUTES=$((ATTEMPTS * DELAY_SECONDS / 60))

          echo "Checking Maven Central availability for ${ARTIFACT}:${V} for up to ${MAX_WAIT_MINUTES} minutes."
          echo "POM URL: ${POM_URL}"
          for attempt in $(seq 1 "${ATTEMPTS}"); do
            status="$(curl -L -sS -o /tmp/central-pom.xml -w '%{http_code}' "${POM_URL}" || true)"
            timestamp="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            if [ "${status}" = "200" ]; then
              echo "[${timestamp}] Maven Central is serving ${ARTIFACT}:${V} (attempt ${attempt}/${ATTEMPTS})."
              ./mvnw -B -q dependency:get -Dartifact="io.github.codexrodrigues:${ARTIFACT}:${V}" -Dtransitive=false
              {
                echo "### Maven Central Availability"
                echo "- Version: \`${V}\`"
                echo "- POM URL: ${POM_URL}"
                echo "- Status: consumable by Maven Central"
                echo "- Wait window: ${MAX_WAIT_MINUTES} minutes"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "[${timestamp}] Maven Central not ready yet for ${ARTIFACT}:${V}; HTTP ${status} (attempt ${attempt}/${ATTEMPTS})."
            if [ "${attempt}" -lt "${ATTEMPTS}" ]; then
              sleep "${DELAY_SECONDS}"
            fi
          done

          echo "::error::Maven Central did not serve ${ARTIFACT}:${V} after ${MAX_WAIT_MINUTES} minutes."
          echo "::error::The Central Portal publish may still be processing, but consumers should not be updated until the artifact resolves."
          exit 1
  documentation:
    needs:
      - release
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: write
