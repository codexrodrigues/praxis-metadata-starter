name: Documentation
'on':
  workflow_call: {}
  workflow_dispatch: {}
jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@v5.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Build and generate Javadoc
        run: |
          ./mvnw --batch-mode -Dmaven.test.skip=true package javadoc:javadoc
          test -f target/site/apidocs/index.html
      - name: Include root doc-files (custom examples)
        run: |
          if [ -d src/main/javadoc/doc-files ]; then
            mkdir -p target/site/apidocs/doc-files
            cp -r src/main/javadoc/doc-files/. target/site/apidocs/doc-files/
          fi
      - name: Prepare docs folder
        run: |
          rm -rf docs/apidocs
          mkdir -p docs/apidocs
          cp -r target/site/apidocs/. docs/apidocs/
      - name: Create root index.html redirect only when no landing exists
        run: |
          mkdir -p docs
          if [ ! -f docs/index.md ] && [ ! -f docs/index.html ]; then
            {
              printf '%s\n' '<!doctype html>'
              printf '%s\n' '<meta charset="utf-8">'
              printf '%s\n' '<meta http-equiv="refresh" content="0; url=apidocs/">'
              printf '%s\n' '<title>Praxis Metadata Starter docs</title>'
              printf '%s\n' '<a href="apidocs/">Ir para a documentacao</a>'
            } > docs/index.html
          fi
      - name: Check local Markdown links
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            while IFS= read -r path; do
              p=${path%%#*}
              if [[ "$p" =~ ^https?:// ]] || [[ "$p" =~ ^mailto: ]]; then
                continue
              fi
              if [[ -z "$p" ]] || [[ "$p" == \#* ]]; then
                continue
              fi
              full=$(python3 -c 'import os,sys; print(os.path.normpath(os.path.join(sys.argv[1], sys.argv[2])))' "$dir" "$p" 2>/dev/null || true)
              if [ -z "$full" ]; then
                continue
              fi
              alt=""
              if [[ "$full" == *.html ]]; then
                alt="${full%.html}.md"
              fi
              if [ ! -e "$full" ] && { [ -z "$alt" ] || [ ! -e "$alt" ]; }; then
                echo "MISSING: $file -> $path (resolved: $full)"
                missing=$((missing+1))
              fi
            done < <(grep -oP "(?<=\]\().*?(?=\))" "$file" | sed 's/\"//g' || true)
          done < <(find . -name "*.md" -print0)
          if [ $missing -ne 0 ]; then
            echo "$missing missing/invalid local links."
            exit 1
          fi
      - name: Convert Markdown to HTML
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          cat <<'EOF' > /tmp/praxis-docs-head.html
          <style>
            :root {
              --bg: #ffffff;
              --fg: #111827;
              --muted: #4b5563;
              --surface: #f9fafb;
              --border: #e5e7eb;
              --accent: #0284c7;
              --code-bg: #1e293b;
              --code-fg: #e2e8f0;
            }
            @media (prefers-color-scheme: dark) {
              :root {
                --bg: #0f1115;
                --fg: #e5e7eb;
                --muted: #9ca3af;
                --surface: #151921;
                --border: #2a2f3a;
                --accent: #38bdf8;
                --code-bg: #181c24;
                --code-fg: #e5e7eb;
              }
            }
            body {
              font: 16px/1.65 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
              background: var(--bg);
              color: var(--fg);
              max-width: 980px;
              margin: 0 auto;
              padding: 1.5rem 1.25rem 4rem;
            }
            h1, h2, h3, h4 { line-height: 1.3; margin-top: 1.6rem; margin-bottom: 0.6rem; }
            h1 { border-bottom: 1px solid var(--border); padding-bottom: 0.45rem; }
            h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3rem; }
            a { color: var(--accent); text-decoration: none; }
            a:hover { text-decoration: underline; }
            code {
              font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
              font-size: 0.9em;
              background: var(--surface);
              border: 1px solid var(--border);
              padding: 0.12rem 0.35rem;
              border-radius: 5px;
            }
            pre {
              background: var(--code-bg);
              color: var(--code-fg);
              padding: 1rem;
              border-radius: 8px;
              overflow-x: auto;
              border: 1px solid var(--border);
            }
            pre code {
              background: transparent;
              border: 0;
              padding: 0;
              color: inherit;
            }
            table {
              width: 100%;
              border-collapse: collapse;
              margin: 1rem 0 1.5rem;
              font-size: 0.95rem;
            }
            th, td {
              border: 1px solid var(--border);
              padding: 0.55rem 0.75rem;
              text-align: left;
              vertical-align: top;
            }
            th { background: var(--surface); font-weight: 600; }
            blockquote {
              margin: 1rem 0;
              padding: 0.65rem 1rem;
              border-left: 4px solid var(--accent);
              background: var(--surface);
              border-radius: 0 8px 8px 0;
            }
            hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
            .praxis-topnav {
              display: flex;
              flex-wrap: wrap;
              gap: 1rem;
              align-items: center;
              padding: 0.75rem 1rem;
              margin-bottom: 1.5rem;
              background: var(--surface);
              border: 1px solid var(--border);
              border-radius: 10px;
              font-size: 0.92rem;
            }
            .praxis-topnav strong { margin-right: 0.4rem; }
          </style>
          EOF
          cat <<'EOF' > /tmp/praxis-docs-before.html
          <nav class="praxis-topnav" aria-label="Praxis Navigation">
            <strong>Praxis Metadata Starter</strong>
            <a href="https://codexrodrigues.github.io/praxis-metadata-starter/">Docs Home</a>
            <a href="https://codexrodrigues.github.io/praxis-metadata-starter/guides/index.html">Guias</a>
            <a href="https://codexrodrigues.github.io/praxis-metadata-starter/architecture-overview.html">Arquitetura</a>
            <a href="https://codexrodrigues.github.io/praxis-metadata-starter/apidocs/">Javadoc</a>
            <a href="https://praxis-api-quickstart.onrender.com/praxis/cockpit" target="_blank" rel="noopener">Live Cockpit</a>
            <a href="https://github.com/codexrodrigues/praxis-metadata-starter" target="_blank" rel="noopener">GitHub</a>
          </nav>
          EOF
          cat <<'EOF' > /tmp/praxis-docs-after.html
          <script type="module">
            const blocks = document.querySelectorAll('pre.mermaid, pre > code.language-mermaid');
            if (blocks.length > 0) {
              const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');
              const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
              mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default' });
              const nodes = [];
              blocks.forEach((el) => {
                const pre = el.tagName === 'PRE' ? el : el.parentElement;
                const container = document.createElement('div');
                container.className = 'mermaid';
                container.textContent = el.textContent;
                pre.replaceWith(container);
                nodes.push(container);
              });
              await mermaid.run({ nodes });
            }
          </script>
          EOF
          while IFS= read -r -d '' md; do
            title=$(grep -m1 '^# ' "$md" | sed 's/^# \+//')
            if [ -z "$title" ]; then title=$(basename "$md" .md); fi
            pandoc "$md" -o "${md%.md}.html" --standalone \
              --metadata title="$title" \
              --include-in-header=/tmp/praxis-docs-head.html \
              --include-before-body=/tmp/praxis-docs-before.html \
              --include-after-body=/tmp/praxis-docs-after.html
          done < <(find docs -name '*.md' -print0)
      - name: Generate sitemap.xml from published HTML pages
        run: |
          python3 -c '
          from pathlib import Path
          base_url = "https://codexrodrigues.github.io/praxis-metadata-starter"
          docs_dir = Path("docs")
          excluded = {"404.html"}
          urls = ["/"]
          for html in sorted(docs_dir.rglob("*.html")):
              rel = html.relative_to(docs_dir).as_posix()
              if rel in excluded:
                  continue
              urls.append(f"/{rel}")
          sitemap = [
              "<?xml version=\"1.0\" encoding=\"UTF-8\"?>",
              "<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\">",
          ]
          for path in urls:
              sitemap.append("  <url>")
              sitemap.append(f"    <loc>{base_url}{path}</loc>")
              sitemap.append("  </url>")
          sitemap.append("</urlset>")
          (docs_dir / "sitemap.xml").write_text("\\n".join(sitemap) + "\\n", encoding="utf-8")
          '
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
    timeout-minutes: 20
