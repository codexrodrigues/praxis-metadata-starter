# Assigned resource-contract fixture binds datasource and isolated schema before Hibernate DDL.
spring:
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
springdoc:
  api-docs:
    enabled: true
praxis:
  hateoas:
    enabled: true
